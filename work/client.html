			{src: "../assets/client/PLANADVISER-Shapes-1-TildaRose.jpg", description: "planadviser collection", link: "../projects/client_planadviser_collection.html"},
			{src: "../assets/featured/Moomin-Museum-Sketchbook-Residency-Cabin-Backyard-TildaRose.jpg", description: "moomin  museum", link: "../projects/moomin_museum.html"},
			{src: "../assets/client/PLANSPONSOR-Measurements-Fall-Editorial-TildaRose.jpg", description: "plansponsor collection", link: "../projects/client_plansponsor_collection.html"},
			{src: "../assets/client/Read-With-Audrey-Tove-Jansson-Summer-Book-TildaRose.jpg", description: "listen with audrey", link: "../projects/client_audrey.html"},
			{src: "../assets/client/UC-Merced-Client-Project-Campus-Seasons-TildaRose.gif", description: "uc merced", link: "../projects/client_ucmerced.html"},
			{src: "../assets/client/WSJ-Dating-Apps-TildaRose.jpg", description: "wall street journal", link: "../projects/client_wsj.html"},

    <div class="masonry">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
        <div class="column" id="col3"></div>
    </div>

    <script>
        const columns = [
            document.getElementById("col1"),
            document.getElementById("col2"),
            document.getElementById("col3")
        ];

        // Example distribution: round robin (0 → col1, 1 → col2, 2 → col3, repeat)
        images.forEach((item, i) => {
            const galleryItem = document.createElement("div");
            galleryItem.className = "gallery-item";

            const img = document.createElement("img");
            img.src = item.src;
            img.alt = item.description || "";

            const desc = document.createElement("div");
            desc.className = "description";
            desc.textContent = item.description;

            if (item.link) {
                const link = document.createElement("a");
                link.href = item.link;
                link.appendChild(img);
                galleryItem.appendChild(link);
            } else {
                galleryItem.appendChild(img);
            }

            galleryItem.appendChild(desc);

            // Place in one of the columns
            const colIndex = i % 3; // change logic if you want custom placement
            columns[colIndex].appendChild(galleryItem);
        });
    </script>

    <iframe width="700" height="400"
        class="youtube-embed"
        src="https://www.youtube.com/embed/r4tYm9AXzmI"
        frameborder="0"
        allowfullscreen>

    <div id="social_media"></div>
    <script>
        fetch('components/index_social_media.html')
        .then(response => response.text())
        .then(data => document.getElementById('social_media').innerHTML = data);
