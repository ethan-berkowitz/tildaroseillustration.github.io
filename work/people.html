<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>client - tilda rose</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="icon" href="../assets/logos/Logo-Initials-TildaRose.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@100;400;500;600&display=swap" rel="stylesheet">

    <script src="../scripts/navbar.js"></script>
</head>
<body>
    <a href="../index.html">
        <img src="../assets/branding/Logo/Logo-Animation-TildaRose.gif" alt="Tilda Rose" class="title-gif">
    </a>

    <div id="navbar"></div>

    <h1>people</h1>
    <div class="spacer-lg" aria-hidden="true"></div>

    <!-- Modal -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" alt="">
    </div>

	<script>
		const images = [
			{src: "../assets/people/Croquis-Poster-LiveDrawing-TildaRose.jpg", description: "an evening of croquis"},
			{src: "../assets/featured/Self-Portrait-Pose-Figure-Woman-TildaRose.jpg", description: "pose I"},
			{src: "../assets/people/Billie-Holiday-Painting-Musician-Portrait-TildaRose.jpg", description: "billie holiday"},
			{src: "../assets/featured/DickKet-SelfPortrait-ArtHistory-Painting-TildaRose.jpg", description: "dick ket"},
            {src: "../assets/people/Moonlit-Singer-Inkdrawing-TildaRose.jpg", description: "the singer"},
            {src: "../assets/animations/WSOY-BookCover-Animation.gif", description: "wsoy"},
            {src: "../assets/featured-inside/Bugtown/Come-To-Bugtown-InkDrawing-TildaRose.jpg", description: "come to bugtown", link: "../projects/bugtown.html"}, 
			{src: "../assets/black_and_white/Diver-Swimmer-Charcoal-Sketch-TildaRose.jpg", description: "the diver"},
            {src: "../assets/animations/Rowboat-Animation-TildaRose-Transparent.gif", description: "rowboating"},
			{src: "../assets/featured/CatNap-Animation-Gouache-Small-TildaRose.gif", description: "howdy! animation"},
			{src: "../assets/people/Townes-VanZandt-Portrait-Gouache-Painting-TildaRose.jpg", description: "townes van zandt"},
			{src: "../assets/people/Boy-Butterfly-Gouache-Painting-TildaRose.jpg", description: "boy and a butterfly"},
			{src: "../assets/people/BigCatch-Meeting-Swamp-ChildrensBook-TildaRose.jpg", description: "the catch i"},
			{src: "../assets/black_and_white/Dancer-Charcoal-Sketch-TildaRose.jpg", description: "the dancer"},
			{src: "../assets/featured/SelfPortrait-Death-Skeleton-Wall-TildaRose.jpg", description: "the devil"},
			{src: "../assets/people/Justin-Townes-Earle-Portrait-TildaRose.jpg", description: "justin townes earle"},
			{src: "../assets/people/Rehearsal-Performance-Music-Piano-Keyboard-Drums-TildaRose.jpg", description: "the rehearsal"},
			{src: "../assets/people/Edvard-Munch-Portrait-Pencil-Sketch-TildaRose.jpg", description: "edvard munch"},
			{src: "../assets/client/Finnish-Union-Of-Health-And-Social-Care-Seasonal-Depression-1-TildaRose.jpg", description: "the finnish union of health and social care"},
			{src: "../assets/featured/ManAndCat-Painting-Illustration-Sepia-TildaRose.jpg", description: "the encounter"},
			{src: "../assets/people/Hands-Watercolor-Study-Portrait-TildaRose.jpg", description: "study of hands"},
			{src: "../assets/people/Eclectic-Sketchbook-Page-1-TildaRose.jpg", description: "sketchbook"},
			{src: "../assets/people/Smoker-Sketchbook-TildaRose.jpg", description: "the smoker"},
			{src: "../assets/people/NickCave-Portrait-Sketchbook-Musician-Performer-Ink-TildaRose.jpg", description: "nick cave"},
            {src: "../assets/animations/Illustrator-Artist-Animation-TildaRose.gif", description: "the illustrator"},
			{src: "../assets/people/Tehy-Magazine-Workplace-Aggression-1-TildaRose.jpg", description: "the finnish union of health and social care"},
			{src: "../assets/client/Cog-CuluturalCalendar-Baroque-Concert-TildaRose.jpg", description: "cog design"},
		];
	</script>
	

    <div class="masonry">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
        <div class="column" id="col3"></div>
    </div>

    <script>
        const modal = document.getElementById("myModal");
        const modalImg = modal.querySelector("img");
        const closeBtn = modal.querySelector(".close");

        const columns = [
            document.getElementById("col1"),
            document.getElementById("col2"),
            document.getElementById("col3")
        ];

        images.forEach((item, i) => {
            const galleryItem = document.createElement("div");
            galleryItem.className = "gallery-item";

            const img = document.createElement("img");
            img.src = item.src;
            img.alt = item.description || "";

            const desc = document.createElement("div");
            desc.className = "description";
            desc.textContent = item.description;

            // If it has a link → wrap in <a> (no modal)
            if (item.link) {
                const link = document.createElement("a");
                link.href = item.link;
                link.appendChild(img);
                galleryItem.appendChild(link);
            } 
            // Otherwise → open modal on click
            else {
                img.style.cursor = "pointer";
                img.addEventListener("click", () => {
                    modal.style.display = "block";
                    modalImg.src = item.src;
                    modalImg.alt = item.description || "";
                });
                galleryItem.appendChild(img);
            }

            galleryItem.appendChild(desc);

            // Distribute across columns
            const colIndex = i % 3;
            columns[colIndex].appendChild(galleryItem);
        });

        // Close modal on X or click outside
        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => {
            if (e.target == modal) modal.style.display = "none";
        };
    </script>

    <div id="social_media"></div>
    <script>
        fetch('../components/social_media.html')
        .then(response => response.text())
        .then(data => document.getElementById('social_media').innerHTML = data);
    </script>

</body>
</html>
