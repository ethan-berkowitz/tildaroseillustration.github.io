<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>black and white - tilda rose</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="icon" href="../assets/logos/Logo-Initials-TildaRose.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@100;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600&display=swap" rel="stylesheet">    
    <script src="../scripts/navbar.js"></script>
</head>
<body>
    <a href="../index.html">
        <img src="../assets/branding/Logo/Logo-Animation-TildaRose.gif" alt="Tilda Rose" class="title-gif">
    </a>

    <div id="navbar"></div>

    <h1>black and white</h1>
    <div class="spacer-lg" aria-hidden="true"></div>
    
	<script>
		const images = [
			{src: "../assets/black_and_white/Coral-3-Charcoal-Sketch-Vignette-TildaRose.jpg", description: "coral iii"},
			{src: "../assets/black_and_white/Beasts-Charcoal-Drawing-Sketchbook-TildaRose.jpg", description: "beasts"},
			{src: "../assets/featured/Unrest-Pattern-Ink-Drawing-TildaRose.jpg", description: "unrest"},
			{src: "../assets/black_and_white/Dancer-Charcoal-Sketch-TildaRose.jpg", description: "the dancer"},
			{src: "../assets/featured/Charcoal-Flower-Sketch-Charcoal-Framed-TildaRose.jpg", description: "dead flowers"},
			{src: "../assets/creatures/Arya-Cat-BlackAndWhite-Drawing-Sketchbook-TildaRose.jpg", description: "arya"},			
			{src: "../assets/black_and_white/Diver-Swimmer-Charcoal-Sketch-TildaRose.jpg", description: "the diver"},
			{src: "../assets/black_and_white/CogDesign-Baroque-Concert-Sketch-2-TildaRose.jpg", description: "the singer"},
			{src: "../assets/black_and_white/Pattern-2-Waves-Ink-TildaRose.jpg", description: "fire and water"},
			{src: "../assets/black_and_white/Vase-Sketchbook-BlackAndWhite-Pencil-Drawing-TildaRose.jpg", description: "a vase"},
			{src: "../assets/people/NickCave-Portrait-Sketchbook-Musician-Performer-Ink-TildaRose.jpg", description: "nick cave"},
			{src: "../assets/black_and_white/Marks-1-Charcoal-Sketchbook-TildaRose.jpg", description: "marks i"},
			{src: "../assets/black_and_white/CogDesign-Baroque-Concert-Sketch-3-TildaRose.jpg", description: "angelic voices"},
			{src: "../assets/black_and_white/Kuvittaja-Magazine-Sketch-1-TildaRose.jpg", description: "imaginary world"},
			{src: "../assets/black_and_white/Crocodile-Vignette-Ink-Wash-TildaRose.jpg", description: "the alligator"},
			{src: "../assets/black_and_white/Pike-Charcoal-Sketch-Baltic-Sea-TildaRose.jpg", description: "pike study"},
			{src: "../assets/black_and_white/Coral-2-Charcoal-Sketch-Vignette-TildaRose.jpg", description: "coral ii"},
			{src: "../assets/black_and_white/Rapture-TildaRose-Linocut-Print.jpg", description: "rapture | linocut"},
			{src: "../assets/black_and_white/SelfPortrait-Death-Skeleton-Pencil-BlackAndWhite-TildaRose.jpg", description: "self portrait"},
			{src: "../assets/black_and_white/Toad-Charcoal-Sketch-BlackAndWhite-Amphibian-TildaRose.jpg", description: "toad"},
			{src: "../assets/black_and_white/Eclectic-Sketchbook-Page-2-TildaRose.jpg", description: "sketchbook i"},
			{src: "../assets/people/PLANSPONSOR-Sketch-3-Marble-Sculptor-TildaRose.jpg", description: "the artist"}
		];
	</script>
	

    <div class="masonry">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
        <div class="column" id="col3"></div>
    </div>

    <script>
        const columns = [
            document.getElementById("col1"),
            document.getElementById("col2"),
            document.getElementById("col3")
        ];

        // Example distribution: round robin (0 → col1, 1 → col2, 2 → col3, repeat)
        images.forEach((item, i) => {
            const galleryItem = document.createElement("div");
            galleryItem.className = "gallery-item";

            const img = document.createElement("img");
            img.src = item.src;
            img.alt = item.description || "";

            const desc = document.createElement("div");
            desc.className = "description";
            desc.textContent = item.description;

            if (item.link) {
                const link = document.createElement("a");
                link.href = item.link;
                link.appendChild(img);
                galleryItem.appendChild(link);
            } else {
                galleryItem.appendChild(img);
            }

            galleryItem.appendChild(desc);

            // Place in one of the columns
            const colIndex = i % 3; // change logic if you want custom placement
            columns[colIndex].appendChild(galleryItem);
        });
    </script>

    <div id="social_media"></div>
    <script>
        fetch('../components/social_media.html')
        .then(response => response.text())
        .then(data => document.getElementById('social_media').innerHTML = data);
    </script>

</body>
</html>
