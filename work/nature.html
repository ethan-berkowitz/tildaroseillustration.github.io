	<script>

			{src: "../assets/creatures/Pike-Vignette-Sea-Underwater-Fish-TildaRose.jpg",

			{src: "../assets/nature/Illustrators-Assocation-Finland-Kuvittajat-Magazine-Residency-MoominMuseum-2-TildaRose.jpg",
			description: "finnish illustrators association"},
			{src: "../assets/featured/Lapland-Finland-Travel-Snow-Winter-Poster-TildaRose.jpg",
			description: "come to lapland"},
			{src: "../assets/client/Tehy-Magazine-Work-Exhaustion-1-TildaRose.jpg",
			description: "finnish union of health and social care"},
			{src: "../assets/nature/Bologna-Terracotta-Roof-TildaRose.jpg",
			description: "bologna"},
			{src: "../assets/nature/Moomin-Museum-Sketchbook-Residency-Cabin-TildaRose.jpg",
			description: "moomin musem x tilda rose"},
			{src: "../assets/featured/IpiPikku-ChildrensBook-Greenhouse-Night-Plants-Animals-Childrens-Book-Tilda-Rose.jpg",
			description: "the mouse and the caterpillar"},
			{src: "../assets/nature/Coral-3-Charcoal-Sketch-Vignette-TildaRose.jpg",
			description: "coral iii"},
			{src: "../assets/featured/Charcoal-Flower-Sketch-Charcoal-Framed-TildaRose.jpg",
			description: "dead flowers"},
			{src: "../assets/nature/Lola-Cave-Landscape-ChildrensBook-TildaRose.jpg",
			description: "shark-toothed cave"},
			{src: "../assets/nature/Moomin-Museum-Sketchbook-Residency-Backyard-TildaRose.jpg",
			description: "moomin museum x tilda rose"},
			{src: "../assets/nature/PoetryFoundation-Archaic-Objects-Article-Illustration-TildaRose.jpg",
			description: "poetry foundation"},

			description: "pentagram | dueling waves"},

			description: "planadviser | cave"},
			{src: "../assets/client/Psykologi-Magazine-Finnish-Psychological-Association-Spot-Illustration-TildaRose.jpg",
			description: "the finnish psychological association"},
			{src: "../assets/client/Psykologi-Magazine-Finnish-Psychological-Association-Article-Illustration-TildaRose.jpg",
			description: "the finnish psychological association"},
			{src: "../assets/creatures/Very-Big-Wave-Mice-2-TildaRose.jpg",

	<div class="gallery" id="gallery"></div>

	<script>
		const modal = document.getElementById("myModal");
		const modalImg = modal.querySelector("img");
		const closeBtn = modal.querySelector(".close");

		const gallery = document.getElementById("gallery");

		// Loop through each image
		images.forEach(item => {
			const galleryItem = document.createElement("div");
			galleryItem.className = "gallery-item";

			const img = document.createElement("img");
			img.src = item.src;
			img.alt = item.description || "";

			const desc = document.createElement("div");
			desc.className = "description";
			desc.textContent = item.description;

			// Handle link behavior
			if (item.link) {
				const link = document.createElement("a");
				link.href = item.link;
				link.appendChild(img);
				galleryItem.appendChild(link);
			} 
			// Handle modal behavior
			else {
				img.style.cursor = "pointer";
				img.addEventListener("click", () => {
					modal.style.display = "block";
					modalImg.src = item.src;
					modalImg.alt = item.description || "";
				});
				galleryItem.appendChild(img);
			}

			galleryItem.appendChild(desc);
			gallery.appendChild(galleryItem);
		});

		// Close modal on X or click outside
		closeBtn.onclick = () => {
			modal.style.display = "none";
		};
		window.onclick = (e) => {
			if (e.target == modal) {
				modal.style.display = "none";
			}
		};
	</script>

	<div id="social_media"></div>

		fetch('../components/social_media.html')
		.then(response => response.text())
		.then(data => document.getElementById('social_media').innerHTML = data);
	</script>
