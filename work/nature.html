<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nature - tilda rose</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="icon" href="../assets/logos/Logo-Initials-TildaRose.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@100;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600&display=swap" rel="stylesheet">    
    <script src="../scripts/navbar.js"></script>
</head>
<body>
    <a href="../index.html">
        <img src="../assets/branding/Logo/Logo-Animation-TildaRose.gif" alt="Tilda Rose" class="title-gif">
    </a>

    <div id="navbar"></div>

    <h1>nature</h1>
    <div class="spacer-lg" aria-hidden="true"></div>
    
	<script>
		const images = [
			{src: "../assets/nature/Coral-2-Charcoal-Sketch-Vignette-TildaRose.jpg", description: "coral i"},
			{src: "../assets/featured/Lapland-Finland-Travel-Snow-Winter-Poster-TildaRose.jpg", description: "come to lapland"},
			{src: "../assets/creatures/Pike-Vignette-Sea-Underwater-Fish-TildaRose.jpg", description: "sleepy pike"},
			{src: "../assets/nature/Illustrators-Assocation-Finland-Kuvittajat-Magazine-Residency-MoominMuseum-2-TildaRose.jpg", description: "finnish illustrators association"},
			{src: "../assets/nature/Moomin-Museum-Sketchbook-Residency-Cabin-TildaRose.jpg", description: "moomin musem x tilda rose"},
			{src: "../assets/nature/Coral-1-Charcoal-Sketch-Vignette-TildaRose.jpg", description: "coral ii"},
			{src: "../assets/nature/Coral-3-Charcoal-Sketch-Vignette-TildaRose.jpg", description: "coral iii"},
			{src: "../assets/client/Tehy-Magazine-Work-Exhaustion-1-TildaRose.jpg", description: "finnish union of health and social care"},
			{src: "../assets/featured/IpiPikku-ChildrensBook-Greenhouse-Night-Plants-Animals-Childrens-Book-Tilda-Rose.jpg", description: "the mouse and the caterpillar"},
			{src: "../assets/nature/Bologna-Terracotta-Roof-TildaRose.jpg", description: "bologna"},
			{src: "../assets/featured/Charcoal-Flower-Sketch-Charcoal-Framed-TildaRose.jpg", description: "dead flowers"},
			{src: "../assets/nature/Moomin-Museum-Sketchbook-Residency-Backyard-TildaRose.jpg", description: "moomin museum x tilda rose"},
			{src: "../assets/creatures/Very-Big-Wave-Mice-TildaRose.jpg", description: "a very big wave | concept ii"},
			{src: "../assets/nature/Lola-Cave-Landscape-ChildrensBook-TildaRose.jpg", description: "shark-toothed cave"},
			{src: "../assets/featured/Lola-Whistling-Valley-Map-TildaRose.jpg", description: "whistling valley"},
			{src: "../assets/creatures/Very-Big-Wave-Mice-2-TildaRose.jpg", description: "a very big wave | concept i"},
			{src: "../assets/nature/PoetryFoundation-Archaic-Objects-Article-Illustration-TildaRose.jpg", description: "poetry foundation"},
			{src: "../assets/client/Psykologi-Magazine-Finnish-Psychological-Association-Article-Illustration-TildaRose.jpg", description: "the finnish psychological association"},
			{src: "../assets/client/Psykologi-Magazine-Finnish-Psychological-Association-Spot-Illustration-TildaRose.jpg", description: "the finnish psychological association"},
			{src: "../assets/client/Pentagram-LMU-Magazine-Editorial-Wave-TildaRose.jpg", description: "pentagram | dueling waves"},
		];
	</script>
	

    <div class="masonry">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
        <div class="column" id="col3"></div>
    </div>

    <script>
        const columns = [
            document.getElementById("col1"),
            document.getElementById("col2"),
            document.getElementById("col3")
        ];

        // Example distribution: round robin (0 → col1, 1 → col2, 2 → col3, repeat)
        images.forEach((item, i) => {
            const galleryItem = document.createElement("div");
            galleryItem.className = "gallery-item";

            const img = document.createElement("img");
            img.src = item.src;
            img.alt = item.description || "";

            const desc = document.createElement("div");
            desc.className = "description";
            desc.textContent = item.description;

            if (item.link) {
                const link = document.createElement("a");
                link.href = item.link;
                link.appendChild(img);
                galleryItem.appendChild(link);
            } else {
                galleryItem.appendChild(img);
            }

            galleryItem.appendChild(desc);

            // Place in one of the columns
            const colIndex = i % 3; // change logic if you want custom placement
            columns[colIndex].appendChild(galleryItem);
        });
    </script>

    <div id="social_media"></div>
    <script>
        fetch('components/index_social_media.html')
        .then(response => response.text())
        .then(data => document.getElementById('social_media').innerHTML = data);
    </script>

</body>
</html>
