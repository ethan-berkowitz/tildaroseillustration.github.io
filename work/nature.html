    <!-- Modal -->

	<script>
		const images = [
            {src: "../assets/featured-inside/Bugtown/Bugtown-Postcard-TildaRose.jpg", description: "greetings from bugtown", link: "../projects/bugtown.html"},
			{src: "../assets/featured/Lapland-Finland-Travel-Snow-Winter-Poster-TildaRose.jpg", description: "come to lapland"},
			{src: "../assets/creatures/Pike-Vignette-Sea-Underwater-Fish-TildaRose.jpg", description: "sleepy pike"},
			{src: "../assets/featured-inside/Works in Charcoal/Coral-Charcoal-Layout-TildaRose.jpg", description: "coral studies in charcoal"},
			{src: "../assets/nature/Illustrators-Assocation-Finland-Kuvittajat-Magazine-Residency-MoominMuseum-2-TildaRose.jpg", description: "finnish illustrators association"},
			{src: "../assets/nature/Moomin-Museum-Sketchbook-Residency-Cabin-TildaRose.jpg", description: "moomin musem x tilda rose", link: "../projects/moomin_museum.html"},
            {src: "../assets/featured-inside/Bugtown/Come-To-Bugtown-InkDrawing-TildaRose.jpg", description: "come to bugtown", link: "../projects/bugtown.html"},
			{src: "../assets/client/Tehy-Magazine-Work-Exhaustion-1-TildaRose.jpg", description: "finnish union of health and social care"},
			{src: "../assets/featured/IpiPikku-ChildrensBook-Greenhouse-Night-Plants-Animals-Childrens-Book-Tilda-Rose.jpg", description: "the mouse and the caterpillar", link: "../projects/mouse_and_caterpillar.html"},
            {src: "../assets/client-inside/This is Finland/Sanoma-ChillSkills-7-TildaRose.jpg", description: "snow turns to ice"},
            {src: "../assets/nature/Bologna-Terracotta-Roof-TildaRose.jpg", description: "bologna"},
			{src: "../assets/featured/Charcoal-Flower-Sketch-Charcoal-Framed-TildaRose.jpg", description: "dead flowers"},
			{src: "../assets/client-inside/This is Finland/Sanoma-ChillSkills-2-TildaRose.jpg", description: "melting glacier"},
            {src: "../assets/animations/WSOY-BookCover-Animation.gif", description: "wsoy", link: "../projects/client_wsoy.html"},
			{src: "../assets/nature/Moomin-Museum-Sketchbook-Residency-Backyard-TildaRose.jpg", description: "moomin museum x tilda rose", link: "../projects/moomin_museum.html"}, 
			{src: "../assets/pattern/MiiaKeskitalo-TildaRose-Pattern.jpg", description: "miia keskitalo x tilda rose", link: "../textile/patterns.html"},
            {src: "../assets/creatures/Very-Big-Wave-Mice-TildaRose.jpg", description: "a very big wave | concept i"},
			{src: "../assets/nature/Lola-Cave-Landscape-ChildrensBook-TildaRose.jpg", description: "shark-toothed cave"},
			{src: "../assets/featured/Lola-Whistling-Valley-Map-TildaRose.jpg", description: "whistling valley"},
            {src: "../assets/featured/Bugtown-TildaRose-Poster.jpg", description: "greetings from bugtown", link: "../projects/bugtown.html"},
			{src: "../assets/nature/PoetryFoundation-Archaic-Objects-Article-Illustration-TildaRose.jpg", description: "poetry foundation"},
            {src: "../assets/client-inside/This is Finland/Sanoma-ChillSkills-3-TildaRose.jpg", description: "ice ice baby"},

		];
	</script>
	

    <div class="masonry">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
        <div class="column" id="col3"></div>
    </div>

    <script>
        const modal = document.getElementById("myModal");
        const modalImg = modal.querySelector("img");
        const closeBtn = modal.querySelector(".close");

        const columns = [
            document.getElementById("col1"),
            document.getElementById("col2"),
            document.getElementById("col3")
        ];

        images.forEach((item, i) => {
            const galleryItem = document.createElement("div");
            galleryItem.className = "gallery-item";

            const img = document.createElement("img");
            img.src = item.src;
            img.alt = item.description || "";

            const desc = document.createElement("div");
            desc.className = "description";
            desc.textContent = item.description;

            // If it has a link → wrap in <a> (no modal)
            if (item.link) {
                const link = document.createElement("a");
                link.href = item.link;
                link.appendChild(img);
                galleryItem.appendChild(link);
            } 
            // Otherwise → open modal on click
            else {
                img.style.cursor = "pointer";
                img.addEventListener("click", () => {
                    modal.style.display = "block";
                    modalImg.src = item.src;
                    modalImg.alt = item.description || "";
                });
                galleryItem.appendChild(img);
            }

            galleryItem.appendChild(desc);

            // Distribute across columns
            const colIndex = i % 3;
            columns[colIndex].appendChild(galleryItem);
        });

        // Close modal on X or click outside
        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => {
            if (e.target == modal) modal.style.display = "none";
        };
    </script>

    <div id="social_media"></div>
    <script>
        fetch('../components/social_media.html')
        .then(response => response.text())
        .then(data => document.getElementById('social_media').innerHTML = data);
    </script>

</body>
</html>
