			{src: "../assets/creatures/AVeryBigWave-PictureBook-Sketch-2.jpg", description: "a very big wave | sketch"},
			{src: "../assets/nature/Moomin-Museum-Sketchbook-Residency-Backyard-TildaRose.jpg", description: "moomin museum x tilda rose"},

			{src: "../assets/creatures/Daphne-Cat-Animation-Gouache-1-Medium-TildaRose.gif", description: "daphne"},

    <div class="masonry">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
        <div class="column" id="col3"></div>
    </div>

    <script>
        const columns = [
            document.getElementById("col1"),
            document.getElementById("col2"),
            document.getElementById("col3")
        ];

        // Example distribution: round robin (0 → col1, 1 → col2, 2 → col3, repeat)
        images.forEach((item, i) => {
            const galleryItem = document.createElement("div");
            galleryItem.className = "gallery-item";

            const img = document.createElement("img");
            img.src = item.src;
            img.alt = item.description || "";

            const desc = document.createElement("div");
            desc.className = "description";
            desc.textContent = item.description;

            if (item.link) {
                const link = document.createElement("a");
                link.href = item.link;
                link.appendChild(img);
                galleryItem.appendChild(link);
            } else {
                galleryItem.appendChild(img);
            }

            galleryItem.appendChild(desc);

            // Place in one of the columns
            const colIndex = i % 3; // change logic if you want custom placement
            columns[colIndex].appendChild(galleryItem);
        });
    </script>

    <div id="social_media"></div>
    <script>
        fetch('components/index_social_media.html')
        .then(response => response.text())
        .then(data => document.getElementById('social_media').innerHTML = data);
    </script>

</body>
