<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>creatures - tilda rose</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="icon" href="../assets/logos/Logo-Initials-TildaRose.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@100;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600&display=swap" rel="stylesheet">    
    <script src="../scripts/navbar.js"></script>
</head>
<body>
    <a href="../index.html">
        <img src="../assets/branding/Logo/Logo-Animation-TildaRose.gif" alt="Tilda Rose" class="title-gif">
    </a>

    <div id="navbar"></div>

    <h1>creatures</h1>
    <div class="spacer-lg" aria-hidden="true"></div>
    
    <!-- Modal -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" alt="">
    </div>

    <script>
        const images = [
            {src: "../assets/pattern/Fish-Pike-Green-1-TildaRose.jpg", description: "northern european pike"},
            {src: "../assets/creatures/Turtle-Painting-Framed-TildaRose.jpg", description: "the turtle"},
            {src: "../assets/featured-inside/A Very Big Wave/AVeryBigWave-PictureBook-TildaRose-1.jpg", description: "a very big wave i"},
            {src: "../assets/creatures/IpiAndPikku-Greenhouse-Night-Plants-Animals-Childrens-Book-TildaRose.jpg", description: "the greenhouse i"},
            {src: "../assets/creatures/TildaRose-FlyingEye-Illustrated-Portrait-3.jpg", description: "self-portrait"},
            {src: "../assets/creatures/MouseAndCrab-Tide-TildaRose.jpg", description: "crab and mouse"},
            {src: "../assets/featured-inside/Bugtown/Come-To-Bugtown-InkDrawing-TildaRose.jpg", description: "come to bugtown", link: "../projects/bugtown.html"},
            {src: "../assets/featured/Snake-Painting-Character-Monster-TildaRose.jpg", description: "the snake"},
            {src: "../assets/featured/Flounder-Cover-NoBackground-TildaRose.jpg", description: "flounder stuffie"},
            {src: "../assets/creatures/AVeryBigWave-PictureBook-TildaRose-2.jpg", description: "a very big wave"},
            {src: "../assets/featured/Bugtown-TildaRose-Poster.jpg", description: "greetings from bugtown", link: "../projects/bugtown.html"},
            {src: "../assets/featured/PurpleDragon-Sculpture-2-TildaRose.jpg", description: "the magic dragon"},
            {src: "../assets/featured-inside/Bugtown/Greetings-From-Bugtown-TildaRose.jpg", description: "greetings from bugtown", link: "../projects/bugtown.html"},
            {src: "../assets/creatures/Very-Big-Wave-Mice-TildaRose.jpg", description: "a very big wave | concept ii"},
            {src: "../assets/creatures/Pike-Vignette-Sea-Underwater-Fish-TildaRose.jpg", description: "sleepy pike"},
            {src: "../assets/animations/Pacing-TildaRose-Sketch-2.gif", description: "pacing beast"},
            {src: "../assets/creatures/Crocodile-Vignette-Ink-Wash-TildaRose.jpg", description: "alligator"},
            {src: "../assets/creatures/IpiAndPikku-Greenhouse-Plants-Animals-Childrens-Book-TildaRose.jpg", description: "the greenhouse ii"},
            {src: "../assets/creatures/AVeryBigWave-PictureBook-TildaRose-4_1.jpg", description: "a very big wave iv"},
            {src: "../assets/black_and_white/Beasts-Charcoal-Drawing-Sketchbook-TildaRose.jpg", description: "beasts"},
            {src: "../assets/nature/Moomin-Museum-Sketchbook-Residency-Backyard-TildaRose.jpg", description: "moomin museum x tilda rose"},
            {src: "../assets/pattern/Cat-Pattern-TildaRose.jpg", description: "patterns", link: "../textile/patterns.html"},
            {src: "../assets/creatures/Daphne-Cat-Animation-Gouache-1-Medium-TildaRose.gif", description: "daphne"},
            {src: "../assets/creatures/Space-Dragon-Vintage-TildaRose.jpg", description: "Space Dragon"},
            {src: "../assets/creatures/AVeryBigWave-PictureBook-Sketch-3.jpg.jpg", description: "a very big wave | sketch"},
        ];
    </script>

    <div class="masonry">
        <div class="column" id="col1"></div>
        <div class="column" id="col2"></div>
        <div class="column" id="col3"></div>
    </div>

    <script>
        const modal = document.getElementById("myModal");
        const modalImg = modal.querySelector("img");
        const closeBtn = modal.querySelector(".close");

        const columns = [
            document.getElementById("col1"),
            document.getElementById("col2"),
            document.getElementById("col3")
        ];

        images.forEach((item, i) => {
            const galleryItem = document.createElement("div");
            galleryItem.className = "gallery-item";

            const img = document.createElement("img");
            img.src = item.src;
            img.alt = item.description || "";

            const desc = document.createElement("div");
            desc.className = "description";
            desc.textContent = item.description;

            // If it has a link → wrap in <a> (no modal)
            if (item.link) {
                const link = document.createElement("a");
                link.href = item.link;
                link.appendChild(img);
                galleryItem.appendChild(link);
            } 
            // Otherwise → open modal on click
            else {
                img.style.cursor = "pointer";
                img.addEventListener("click", () => {
                    modal.style.display = "block";
                    modalImg.src = item.src;
                    modalImg.alt = item.description || "";
                });
                galleryItem.appendChild(img);
            }

            galleryItem.appendChild(desc);

            // Distribute across columns
            const colIndex = i % 3;
            columns[colIndex].appendChild(galleryItem);
        });

        // Close modal on X or click outside
        closeBtn.onclick = () => modal.style.display = "none";
        window.onclick = (e) => {
            if (e.target == modal) modal.style.display = "none";
        };
    </script>

    <div id="social_media"></div>
    <script>
        fetch('../components/social_media.html')
        .then(response => response.text())
        .then(data => document.getElementById('social_media').innerHTML = data);
    </script>
</body>
</html>
