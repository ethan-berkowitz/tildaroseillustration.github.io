<body>
	<a href="../index.html">
		<img src="../assets/branding/Logo/Logo-Animation-TildaRose.gif" alt="Tilda Rose" class="title-gif">
	</a>
	<div id="navbar"></div>

	<h4>
		<a href="../work/client.html">client</a>
		<span class="plus">+</span>
		<a href="../work/nature.html">nature</a>
	</h4>

	<h1>the poetry foundation</h1>
	<h3>illustration for "archaic objects" by andrea brady about the work of american poet A.E. Stallings.</h3>
	<h3>ad: jeremy lybarger</h3>
	<div class="spacer-lg-after-text" aria-hidden="true"></div>

	<div class="single_project_item_wide">
		<img src="../assets/client/PoetryFoundation-Archaic-Objects-Article-Illustration-TildaRose.jpg">
		<img src="../assets/client-inside/PoetryFoundation-Archaic-Objects-Article-Illustration-Sketches-TildaRose.jpg">
	</div>

	<div class="single_project_item">
		<img src="../assets/client-inside/PoetryFoundation-Archaic-Objects-Article-TildaRose.jpg">
	</div>
	
	<div class="gallery_project" id="gallery_project"></div>

	<script>
		const gallery = document.getElementById("gallery_project");

		images.forEach(item => {
			const galleryItem = document.createElement("div");
			galleryItem.className = "gallery-item-projects";

			const link = document.createElement("a");

			const img = document.createElement("img");
			img.src = item.src;
			img.alt = item.description || "";

			link.appendChild(img); // wrap image in <a>

			const desc = document.createElement("div");
			desc.className = "description";
			desc.textContent = item.description;

			galleryItem.appendChild(link); // append <a> instead of img directly
			galleryItem.appendChild(desc);

			gallery.appendChild(galleryItem);
		});
	</script>

	<div id="social_media"></div>
	<script>
		fetch('../components/social_media.html')
		.then(response => response.text())
		.then(data => document.getElementById('social_media').innerHTML = data);
	</script>

</body>
</html>
