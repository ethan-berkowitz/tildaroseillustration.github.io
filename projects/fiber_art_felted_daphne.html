<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>felted daphne - tilda rose</title>
	<link rel="stylesheet" href="../styles/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style></style>
	<script src="../scripts/navbar.js"></script>
</head>
<body>
	<a href="../index.html">
		<img src="../assets/branding/Logo/Logo-Animation-TildaRose.gif" alt="Tilda Rose" class="title-gif">
	</a>
	<div id="navbar"></div>

	<h4>
		<a href="../textile/fiber_art.html">fiber art</a>
		<span class="plus">+</span>
		<a href="../work/creatures.html">creatures</a>
	</h4>

	<h1>felted daphne</h1>
	<h3>Made with armature wire, one sponge and a bunch of wool. inspired by my delightful studio assistant daphne. nfs. </h3>
	<div class="spacer-lg-after-text" aria-hidden="true"></div>

	<script>
		const images = [
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-10-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/COVER-Felt-Daphne-12-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-1-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-2-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-3-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-4-TildaRose.jpg.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-5-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-6-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-7-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-8-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-9-TildaRose.jpg"},
			{src: "../assets/fiber_art/daphne in felt/Felt-Daphne-11-TildaRose.jpg"}

		];
	</script>
	
	<div class="gallery_textiles" id="gallery_textiles"></div>

	<script>
		const gallery = document.getElementById("gallery_textiles");

		images.forEach(item => {
			const galleryItem = document.createElement("div");
			galleryItem.className = "gallery-item-textiles";

			const link = document.createElement("a");

			const img = document.createElement("img");
			img.src = item.src;
			img.alt = item.description || "";

			link.appendChild(img); // wrap image in <a>

			const desc = document.createElement("div");
			desc.className = "description";
			desc.textContent = item.description;

			galleryItem.appendChild(link); // append <a> instead of img directly
			galleryItem.appendChild(desc);

			gallery.appendChild(galleryItem);
		});
	</script>

	<div id="social_media"></div>
	<script>
		fetch('../components/social_media.html')
		.then(response => response.text())
		.then(data => document.getElementById('social_media').innerHTML = data);
	</script>

</body>
</html>
